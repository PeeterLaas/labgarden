name: Validate static site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node --check dist/app.js
      - run: node --check dist/change-service.js
      - run: node --check dist/resource-library.js
      - run: node --test tests/*.test.cjs
      - run: python3 scripts/check_assets.py
  r-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R tool dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'install.packages(c("shiny", "ellmer", "jsonlite", "remotes")); remotes::install_github("JamesHWade/shinymcp@0476fcf54a66bf82b0d8a1c0ab3bc516629b0a6b", dependencies = NA, upgrade = "never")'
      - run: Rscript tests/integration.R
      - run: node tests/mcp-stdio.cjs
